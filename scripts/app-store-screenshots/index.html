<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Who's First? App Store Screenshots</title>
  <link rel="stylesheet" href="screenshot.css?v=4" />
</head>
<body id="top">
  <main class="poster">
    <header class="poster-header">
      <div class="brand">
        <img src="../../web/icon.svg" alt="" />
        <span>WHO'S FIRST?</span>
      </div>
      <h1 id="headline"></h1>
      <p id="subhead"></p>
    </header>

    <section class="device" aria-label="Who's First? app preview">
      <div class="speaker" aria-hidden="true"></div>
      <div id="app-screen" class="app-screen">
        <p id="app-hint" class="app-hint"></p>
        <header class="app-chrome">
          <button id="mode-toggle" class="mode-toggle" type="button" aria-pressed="false" aria-label="Chooser mode">
            <svg class="mode-toggle-icon" viewBox="0 0 40 40" aria-hidden="true">
              <g class="mode-icon-together">
                <circle class="mode-orbit" cx="20" cy="20" r="13.25" />
                <circle class="mode-dot mode-dot-a" cx="20" cy="8.5" r="4.25" />
                <circle class="mode-dot mode-dot-b" cx="10.1" cy="25.7" r="4.25" />
                <circle class="mode-dot mode-dot-c" cx="29.9" cy="25.7" r="4.25" />
                <path class="mode-spark" d="M20 15.2v9.6M15.2 20h9.6" />
              </g>
              <g class="mode-icon-tap-in">
                <path class="mode-token-trail" d="M7 29.5C11.5 25 12.5 15 19.5 13.5S29 15 33 8.5" />
                <g class="mode-token mode-token-one">
                  <circle cx="9" cy="29" r="6" />
                  <text x="9" y="31.6">1</text>
                </g>
                <g class="mode-token mode-token-two">
                  <circle cx="20" cy="18.5" r="6" />
                  <text x="20" y="21.1">2</text>
                </g>
                <g class="mode-token mode-token-three">
                  <circle cx="31" cy="8.5" r="6" />
                  <text x="31" y="11.1">3</text>
                </g>
              </g>
            </svg>
          </button>
          <button class="info-button" type="button" aria-label="Help">?</button>
        </header>
        <div id="rings" class="rings" aria-hidden="true"></div>

        <section id="tap-in-dock" class="tap-in-dock" hidden>
          <div class="tap-in-copy">
            <p id="player-count" class="player-count"></p>
            <p id="tap-in-guidance" class="tap-in-guidance"></p>
          </div>
          <div class="tap-actions">
            <button class="secondary-action" type="button">Undo</button>
            <button class="secondary-action" type="button">Clear</button>
            <button id="pick-entry" class="primary-action" type="button"></button>
          </div>
        </section>

        <section id="about-card" class="about-card" hidden>
          <button class="close-button" type="button" aria-label="Close">×</button>
          <div class="mini-ring" aria-hidden="true"></div>
          <p class="eyebrow">Who goes first?</p>
          <h2>Who's First?</h2>
          <ol>
            <li>Use one finger to touch the iPhone.</li>
            <li>Hold still while the rings count down.</li>
            <li>The glowing finger is the one that goes first.</li>
          </ol>
          <p class="privacy-note">No accounts, ads, or tracking. Every choice happens on this device.</p>
          <div class="about-links"><span>Privacy</span><span>Help &amp; support</span></div>
          <p class="version">Version 1.0</p>
        </section>
      </div>
    </section>
  </main>
  <script src="screenshot.js?v=4"></script>
</body>
</html>
